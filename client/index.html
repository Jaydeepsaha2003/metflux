<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/s/admin/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/s/admin/icons/icon-192.png" />
    <!-- iOS home-screen icon must be a real PNG (it won't follow a redirect to
         SVG), so point straight at the bundled PNG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/s/admin/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Admin panel — production and dispatch management for transformer cores" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Admin" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Admin</title>
    <script>
      (function () {
        var h = location.hostname.toLowerCase();
        var brand = h.includes('toroflux') ? 'Toroflux Industries' : 'Metflux';
        document.title = brand + ' Admin';
        var m = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (m) m.setAttribute('content', brand);
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
